<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>數學小浮板｜Math Float</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&display=swap">
<style>
:root{--glass:#f7eee6;--blue:#7f9fcb;--blue-d:#5f82b4;--rose:#d28672;--rose-d:#a9614f;--plum:#473f4d;--mute:#a4959b;--line:rgba(210,134,114,.16);
  --serif:"Cormorant Garamond","Noto Serif TC","Songti TC","PMingLiU",Georgia,serif;
  --sans:"Noto Sans TC","Microsoft JhengHei","PingFang TC",system-ui,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;font-family:var(--sans);color:var(--plum);background:#cbbac1}
button{font:inherit;cursor:pointer;border:1px solid rgba(210,134,114,.22);background:#fff;border-radius:10px;min-width:32px;height:32px;padding:0 8px;font-size:15px;color:var(--plum);line-height:1}
button:hover{background:#fbf3ec}
button.main{background:var(--rose);border-color:var(--rose);color:#fff;font-weight:700}
button.main:hover{background:var(--rose-d)}
select{font:inherit;height:30px;border-radius:10px;border:1px solid rgba(210,134,114,.22);background:#fff;padding:0 4px;font-size:14px;color:var(--plum)}
#app{position:fixed;inset:0;padding:14px;background:
  radial-gradient(60% 50% at 15% 0%,#fbeef2 0%,transparent 70%),
  radial-gradient(50% 60% at 100% 100%,#e2bfd0 0%,transparent 70%),
  linear-gradient(170deg,#e9dcd6 0%,#ecd0d9 60%,#cdbcc6 100%)}
.frame{position:relative;height:100%;display:grid;grid-template-columns:136px 1fr 200px;grid-template-rows:70px 1fr;border-radius:36px;
  background:radial-gradient(38% 46% at 0% 38%,rgba(214,120,160,.55),transparent 70%),radial-gradient(34% 40% at 100% 22%,rgba(176,150,230,.5),transparent 70%),radial-gradient(40% 44% at 96% 96%,rgba(240,150,150,.5),transparent 70%),radial-gradient(40% 36% at 42% 0%,rgba(255,200,170,.45),transparent 70%),linear-gradient(165deg,#f6dbe5,#eec6d5 60%,#e6bdd0);border:1px solid rgba(255,255,255,.95);
  box-shadow:0 34px 70px -24px rgba(105,80,95,.4);overflow:hidden}
/* header with notch */
header.top{grid-column:1/-1;display:flex;align-items:flex-start;gap:14px;padding:0 20px 0 24px;position:relative;z-index:30}
.brand{display:flex;align-items:center;gap:10px;min-width:0;height:70px}
.moon{width:24px;height:24px;border-radius:50%;border:2px solid var(--rose-d);position:relative;flex:none}
.moon::after{content:"";position:absolute;width:20px;height:20px;border-radius:50%;background:#f7eee6;top:-5px;right:-6px}
.brand b{display:block;font-family:var(--serif);font-weight:500;font-size:25px;letter-spacing:.1em;color:var(--rose-d);white-space:nowrap;line-height:1}
.brand small{display:block;font-size:11px;letter-spacing:.28em;color:var(--mute);margin-top:3px;white-space:nowrap}
.notch{margin:0 auto;padding:6px 26px 10px;background:rgba(255,250,252,.9);border-radius:0 0 30px 30px;border:1px solid #fff;border-top:0;box-shadow:0 10px 22px -12px rgba(105,80,95,.35)}
.pills{display:flex;gap:4px}
.pill{height:auto;border:1px solid transparent;background:transparent;border-radius:14px;padding:6px 16px;display:flex;flex-direction:column;align-items:center;gap:2px;line-height:1.1}
.pill b{font-size:14px;font-weight:700;color:var(--plum);white-space:nowrap}
.pill small{font-family:var(--serif);font-style:italic;font-size:12px;color:var(--mute);letter-spacing:.04em}
.pill:hover,.pill.on{background:#fff;border-color:rgba(210,134,114,.18);box-shadow:0 2px 10px rgba(105,80,95,.14)}
.tr{display:flex;gap:8px;align-items:center;height:70px}
.tb{height:38px;border-radius:14px;border:1px solid rgba(255,255,255,.95);background:rgba(255,255,255,.72);color:var(--rose-d);display:flex;align-items:center;gap:6px;padding:0 12px;font-size:13px;font-weight:700;box-shadow:0 4px 12px rgba(105,80,95,.16);white-space:nowrap}
.tb svg{width:18px;height:18px}
.tb.on{background:var(--rose);color:#fff}
/* rail */
.rail{grid-row:2;display:flex;flex-direction:column;gap:12px;padding:2px 6px 16px 14px;z-index:20;overflow-y:auto;scrollbar-width:none}
.cap{display:flex;flex-direction:column;gap:4px;padding:6px;border-radius:22px;background:rgba(255,255,255,.5);border:1px solid rgba(255,255,255,.9);box-shadow:0 6px 16px -8px rgba(105,80,95,.3)}
.rb{height:38px;width:100%;border:0;border-radius:14px;background:transparent;color:#9a8792;display:flex;align-items:center;gap:9px;padding:0 10px;font-size:14px;font-weight:600;text-align:left}
  .rb span{white-space:nowrap}
.rb svg{width:19px;height:19px;flex:none}
.rb:hover{background:rgba(255,255,255,.9)}
.rb.on{background:linear-gradient(135deg,#d36d92,#b04a70);color:#fff;box-shadow:0 6px 14px -6px rgba(190,110,90,.7)}
.rb.on span::after{content:" ✦";font-size:10px}
.rb.danger{color:#c9506f}
/* board */
#board{grid-column:2;grid-row:2;position:relative;margin:0 6px 16px 4px;border-radius:28px;overflow:hidden;touch-action:none;
  --gl:#efe4da;background-color:rgba(255,252,253,.94);border:1px solid #fff;box-shadow:inset 0 0 0 1px var(--line),0 14px 34px -14px rgba(105,80,95,.35);transition:background-color .3s}
#board.night{--gl:rgba(255,190,215,.13);background-color:#3b3948}
#board.bg-grid{background-image:linear-gradient(var(--gl) 1px,transparent 1px),linear-gradient(90deg,var(--gl) 1px,transparent 1px);background-size:30px 30px}
#board.bg-dots{background-image:radial-gradient(var(--gl) 1.8px,transparent 2.1px);background-size:30px 30px}
#board.bg-dots:not(.night){--gl:#d9c6ba}
#board.bg-lines{background-image:linear-gradient(transparent 39px,var(--gl) 39px);background-size:100% 40px}
#widgets{position:absolute;inset:0;z-index:1}
#ink{position:absolute;left:0;top:0;z-index:5;cursor:crosshair;touch-action:none}
/* side panel */
.side{grid-column:3;grid-row:2;margin:0 16px 16px 6px;padding:16px 14px;border-radius:26px;background:rgba(255,255,255,.55);border:1px solid rgba(255,255,255,.95);box-shadow:0 10px 26px -14px rgba(105,80,95,.35);display:flex;flex-direction:column;gap:14px;z-index:20;overflow-y:auto;scrollbar-width:none}
.side h3{margin:0;font-family:var(--serif);font-weight:500;font-size:24px;color:var(--plum);letter-spacing:.03em;line-height:1}
.side h3 i{display:block;font-size:15px;color:var(--mute);margin-top:4px}
.lab{font-size:11px;letter-spacing:.14em;color:var(--mute);display:flex;justify-content:space-between;margin-bottom:6px}
.lab b{color:var(--rose-d)}
.prev{height:44px;border-radius:14px;background:rgba(255,255,255,.75);border:1px solid var(--line);display:grid;place-items:center}
.prev.dark{background:#3b3948}
.prev i{display:block;width:70%;border-radius:20px}
#colors{display:grid;grid-template-columns:repeat(6,1fr);gap:5px}
.sw{min-width:0;width:100%;height:auto;aspect-ratio:1;border-radius:6px;padding:0;border:2px solid #fff;box-shadow:0 0 0 1px rgba(160,90,115,.28)}
.sw.on{box-shadow:0 0 0 2.5px var(--rose)}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:5px;border-radius:5px;background:linear-gradient(90deg,var(--rose) var(--p,25%),#e6dad2 var(--p,25%));outline:0;margin:6px 0}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:20px;border-radius:5px;background:#fff;border:2px solid var(--rose);cursor:pointer}
input[type=range]::-moz-range-thumb{width:10px;height:18px;border-radius:5px;background:#fff;border:2px solid var(--rose);cursor:pointer}
.wide{height:42px;border-radius:14px;border:0;background:linear-gradient(135deg,#cf6a8e,#b04a70);color:#fff;font-weight:700;font-size:14px;letter-spacing:.08em;box-shadow:0 10px 20px -10px rgba(190,110,90,.8);white-space:nowrap}
.wide:hover{background:linear-gradient(135deg,#c75f85,#a34066)}
.side .credit{margin-top:auto;white-space:nowrap;font-size:9.5px;color:var(--mute);letter-spacing:.06em;line-height:1.6;text-align:center}
.side .credit em{font-family:var(--serif);font-size:13px}
/* tray */
.menu{position:absolute;z-index:60;background:rgba(255,255,255,.88);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid #fff;border-radius:24px;
  box-shadow:0 20px 44px -14px rgba(105,80,95,.45);padding:12px;display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px;width:min(430px,calc(100% - 24px))}
.menu[hidden]{display:none}
.menu .ttl{grid-column:1/-1;font-family:var(--serif);font-size:20px;color:var(--rose-d);letter-spacing:.06em;padding:0 4px}
.menu .ttl small{font-family:var(--sans);font-size:12px;color:var(--mute);letter-spacing:.1em;margin-left:6px}
.menu .it{height:auto;padding:10px 4px 8px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:14px;border-radius:16px;border:1px solid rgba(210,134,114,.12);background:rgba(255,255,255,.8)}
.menu .it b{font-size:26px;font-weight:400}
.menu .it small{font-family:var(--serif);font-style:italic;color:var(--mute);font-size:12px}
.menu .it.on{border-color:var(--rose);background:#fbf1e9}
#toast{position:absolute;left:50%;top:84px;transform:translateX(-50%);background:rgba(59,42,51,.92);color:#fff;padding:10px 18px;border-radius:14px;font-size:15px;z-index:80;max-width:90%;text-align:center;opacity:0;transition:opacity .25s;pointer-events:none}
#toast.show{opacity:1}
#placeholder{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:20px;background:linear-gradient(170deg,#e9dcd6,#cdbcc6)}
#placeholder[hidden]{display:none}
#placeholder h2{margin:0;font-family:var(--serif);font-weight:500;font-size:34px;color:var(--rose-d);letter-spacing:.08em}
#placeholder p{margin:0;color:#7a6a72;font-size:16px;line-height:1.7}
/* ---- widgets ---- */
.widget{position:absolute;background:rgba(255,255,255,.84);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid #fff;border-radius:22px;
  box-shadow:0 16px 36px -14px rgba(100,80,90,.42),0 0 0 1px rgba(210,134,114,.1);user-select:none;-webkit-user-select:none;transform-origin:50% 50%;touch-action:none}
.wh{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:7px 8px 6px 16px;background:linear-gradient(90deg,rgba(240,196,176,.9),rgba(255,255,255,.5));border-radius:22px 22px 0 0;cursor:move;font-weight:700;font-size:15px;color:var(--rose-d);letter-spacing:.05em}
.wh button{height:26px;width:26px;min-width:26px;border-radius:50%;font-size:12px;padding:0;color:var(--rose-d)}
.wb{padding:10px 12px 12px}
.widget.bare{background:transparent;border:0;box-shadow:none;backdrop-filter:none;-webkit-backdrop-filter:none;cursor:move}
.float-btns{position:absolute;top:-14px;right:-14px;display:flex;gap:4px}
.float-btns button{height:30px;min-width:30px;width:30px;border-radius:50%;padding:0;font-size:14px;color:var(--rose-d);box-shadow:0 3px 8px rgba(105,80,95,.3)}
.rot-handle{cursor:grab}
.row{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:14px;margin-bottom:8px}
.row input{width:58px;font:inherit;height:30px;border:1px solid rgba(210,134,114,.22);border-radius:10px;padding:0 6px;color:var(--plum)}
.row button{height:30px;font-size:14px}
.big{font-size:26px;font-weight:800;text-align:center}
.nodrag{cursor:pointer}
.pv{display:grid;grid-template-columns:repeat(4,92px);gap:6px}
.pv .col{border:2px solid;border-radius:16px;padding:6px 4px;display:flex;flex-direction:column;align-items:center;gap:4px;min-height:200px;background:rgba(255,255,255,.6)}
.pv .name{font-weight:800;font-size:18px}
.pv .discs{display:flex;flex-wrap:wrap;gap:3px;justify-content:center;align-content:flex-start;flex:1;width:100%;min-height:86px}
.pv .discs i{width:15px;height:15px;border-radius:50%;display:block;box-shadow:inset 0 -2px 0 rgba(0,0,0,.12)}
.pv .digit{font-size:24px;font-weight:800}
.pv .digit.warn{color:#d23d68}
.pv .ctl{display:flex;gap:3px}
.pv .ctl button{height:26px;min-width:30px;padding:0 4px;font-size:15px}
.pv .ex{height:24px;font-size:12px;padding:0 4px;min-width:0;width:100%}
.calc{width:240px}
.calc .disp{background:linear-gradient(160deg,#fff,#fdf0f4);border:1px solid rgba(210,134,114,.18);border-radius:14px;padding:8px 10px;text-align:right;margin-bottom:8px;min-height:64px}
.calc .disp small{display:block;color:var(--mute);font-size:13px;min-height:16px;word-break:break-all}
.calc .disp div{font-size:28px;font-weight:800;word-break:break-all;font-family:var(--serif)}
.calc .keys{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.calc .keys button{height:42px;font-size:19px;border-radius:14px}
.calc .keys .op{background:#f6e6dc;color:var(--rose-d)}
.calc .keys .eq{background:var(--rose);color:#fff;border-color:var(--rose)}
.hc{display:grid;grid-template-columns:repeat(10,30px);gap:2px}
.hc div{height:30px;display:flex;align-items:center;justify-content:center;border:1px solid #e8ddd4;border-radius:6px;font-size:13px;font-weight:700;cursor:pointer;background:#fff}

/* ---- connected shapes ---- */
button,select{border-radius:999px}
.frame{border:9px solid var(--glass);border-radius:54px;grid-template-columns:134px minmax(0,1fr) 206px}
header.top{padding:0 14px 0 22px}
.notch{position:relative;background:var(--glass);border:0;border-radius:0 0 38px 38px;padding:4px 22px 10px;box-shadow:none;filter:drop-shadow(0 8px 10px rgba(105,80,95,.14))}
.notch{--f:28px;border-radius:0 0 30px 30px}
.notch::before,.notch::after{content:"";position:absolute;top:0;width:var(--f);height:var(--f)}
.notch::before{left:calc(0px - var(--f));background:radial-gradient(circle at 0 100%,transparent calc(var(--f) - .5px),var(--glass) var(--f))}
.notch::after{right:calc(0px - var(--f));background:radial-gradient(circle at 100% 100%,transparent calc(var(--f) - .5px),var(--glass) var(--f))}
.pill{border-radius:999px}
.tb{border-radius:999px;height:40px;padding:0 16px}
.rail{padding:18px 8px 18px 0;gap:36px;overflow:visible}
.cap{position:relative;background:var(--glass);border:0;border-radius:0 36px 36px 0;padding:10px 10px 10px 8px;box-shadow:none;filter:drop-shadow(4px 6px 8px rgba(105,80,95,.14))}
.cap::before,.cap::after{content:"";position:absolute;left:0;width:18px;height:18px}
.cap::before{top:-18px;background:radial-gradient(circle at 100% 0,transparent 18px,var(--glass) 18.5px)}
.cap::after{top:100%;background:radial-gradient(circle at 100% 100%,transparent 18px,var(--glass) 18.5px)}
.rb{border-radius:999px;height:40px;padding:0 14px}
#board{border-radius:42px;margin:0 10px 14px 6px}
.side{position:relative;margin:18px 0 18px 4px;background:var(--glass);border:0;border-radius:42px 0 0 42px;overflow:visible;box-shadow:none;filter:drop-shadow(-4px 6px 8px rgba(105,80,95,.14));padding:20px 16px 18px 20px}
.side::before,.side::after{content:"";position:absolute;right:0;width:22px;height:22px}
.side::before{top:-22px;background:radial-gradient(circle at 0 0,transparent 22px,var(--glass) 22.5px)}
.side::after{top:100%;background:radial-gradient(circle at 0 100%,transparent 22px,var(--glass) 22.5px)}
.prev{border-radius:999px}
.sw{border-radius:50%}
.wide{border-radius:999px;height:46px}
.menu{border-radius:36px;padding:16px}
.menu .it{border-radius:26px}
.widget{border-radius:30px}
.wh{border-radius:30px 30px 0 0;padding-left:18px}
.wh button,.float-btns button{border-radius:50%}
.wh button.wx,.float-btns button.wx{width:32px;height:32px;min-width:32px;font-size:14px;font-weight:700;background:#fff;color:var(--rose-d);border-color:rgba(210,134,114,.35)}
.wh button.wx:hover,.float-btns button.wx:hover{background:var(--rose);color:#fff}
.menu .it.closeall{grid-column:1/-1;flex-direction:row;justify-content:center;gap:8px;padding:10px;color:var(--rose-d);font-weight:700}
.menu .it.closeall b{font-size:16px}
.calc .keys button{border-radius:999px}
.calc .disp,.pv .col{border-radius:22px}
.row input{border-radius:999px;padding:0 10px}
/* ---- translucent tools ---- */
.widget{background:rgba(255,255,255,.42);backdrop-filter:blur(5px) saturate(1.2);-webkit-backdrop-filter:blur(5px) saturate(1.2);border:1px solid rgba(255,255,255,.85)}
.widget.bare{background:transparent;border:0;backdrop-filter:none;-webkit-backdrop-filter:none}
.wh{background:linear-gradient(90deg,rgba(240,196,176,.6),rgba(255,255,255,.2))}
.widget button,.widget select,.widget .row input{background:rgba(255,255,255,.6)}
.widget button:hover{background:rgba(255,255,255,.9)}
.widget button.main{background:rgba(210,134,114,.88);color:#fff}
.calc .disp{background:rgba(255,255,255,.5)}
.calc .keys .op{background:rgba(214,226,242,.8)}
.calc .keys .eq{background:rgba(210,134,114,.88)}
.pv .col{background:rgba(255,255,255,.35)}
.hc div{background:rgba(255,255,255,.55);border-color:rgba(210,134,114,.18)}
#board.night .widget:not(.bare){background:rgba(255,246,249,.8)}
.szpop{position:absolute;z-index:90;pointer-events:none;display:flex;align-items:center;gap:12px;padding:8px 20px 8px 10px;border-radius:999px;background:rgba(255,251,252,.95);border:1px solid #fff;box-shadow:0 14px 30px -10px rgba(105,80,95,.5)}
.szpop[hidden]{display:none}
.szpop .dotbox{width:66px;height:66px;border-radius:50%;background:#f6e6dc;display:grid;place-items:center;flex:none}
.szpop i{display:block;border-radius:50%;box-sizing:border-box}
.szpop b{display:block;font-size:17px;color:var(--rose-d);white-space:nowrap}
.szpop small{display:block;font-size:11px;color:var(--mute);margin-top:3px;white-space:nowrap}
#board.night~.szpop .dotbox{background:#3b3948}
.rb{-webkit-touch-callout:none;user-select:none;-webkit-user-select:none}
.piece{position:absolute;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}
.rod{box-sizing:border-box;border-radius:6px;border:1.5px solid rgba(60,30,40,.32);box-shadow:0 3px 6px rgba(100,80,90,.25);display:grid;place-items:center;font-weight:800;font-size:15px;color:transparent}
.rod.num{color:#2b1a22;text-shadow:0 0 3px #fff,0 0 3px #fff,0 0 2px #fff;background-image:repeating-linear-gradient(90deg,transparent 0 28.5px,rgba(0,0,0,.22) 28.5px 30px);background-position:-1.5px 0}
.rod.num.v{background-image:repeating-linear-gradient(180deg,transparent 0 28.5px,rgba(0,0,0,.22) 28.5px 30px);background-position:0 -1.5px}
.flower{width:40px;height:40px;filter:drop-shadow(0 2px 3px rgba(100,80,90,.3))}
.flower svg,.chip svg{display:block;pointer-events:none}
.chips{display:flex;gap:5px;justify-content:center}
.widget .chip{width:30px;min-width:30px;height:30px;padding:0;border-radius:9px;font-weight:800;font-size:14px;border:1.5px solid rgba(60,30,40,.25);color:#2b1a22}
.widget .chip.fl{width:44px;height:44px;border-radius:50%;border:0;background:rgba(255,255,255,.6);display:grid;place-items:center}
.pfoot{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:12px;color:var(--mute);white-space:nowrap}
.pfoot label{color:var(--plum);font-size:13px;display:flex;align-items:center;gap:3px}
.pfoot>span:not(.seg){flex:1;text-align:center}
.pfoot button{height:28px;font-size:13px;padding:0 10px}
.pfoot .seg{display:flex;gap:3px}
.widget .pfoot .seg button.on{background:var(--rose);color:#fff;border-color:var(--rose)}
.pfoot .cnt{flex:1;text-align:center;font-size:16px;color:var(--rose-d)}
.phint{font-size:12px;color:var(--mute);text-align:center;margin-top:8px}
.widget.drop{outline:3px dashed var(--rose);outline-offset:3px}
.widget .chip.pick{outline:3px solid var(--rose);outline-offset:2px;transform:scale(1.12)}
.widget .chip{transition:transform .1s;-webkit-touch-callout:none;user-select:none;-webkit-user-select:none}
.phint{line-height:1.6}
.snum{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 12px;border-radius:999px;background:rgba(255,255,255,.7);border:1px solid rgba(210,134,114,.3);cursor:ew-resize;touch-action:none;user-select:none;-webkit-user-select:none}
.snum small{font-size:12px;color:var(--mute)}
.snum b{font-size:17px;color:var(--rose-d);min-width:1.2em;text-align:center}
.snum i{font-style:normal;font-size:12px;color:var(--mute)}
.snum.act{background:var(--rose);border-color:var(--rose)}

<body>
<div id="placeholder" hidden>
  <h2>Floating ✦</h2>
  <p>白板正浮在所有程式最上層。<br>關閉浮動視窗，白板就會回到這裡。</p>
  <button class="main" id="backBtn" style="height:44px;padding:0 22px;border-radius:16px">收回白板</button>
</div>
<div id="app">
 <div class="frame">
  <header class="top">
    <div class="brand"><span class="moon"></span><div><b>MATH FLOAT</b><small>數學小浮板</small></div></div>
    <div class="notch"><nav class="pills" id="pills"></nav></div>
    <div class="tr"><button class="tb" id="shotBtn" title="截取螢幕畫面的一部分，貼到白板"></button><button class="tb" id="layoutBtn"></button><button class="tb" id="setBtn" title="設定"></button><button class="tb" id="nightBtn"></button><button class="tb" id="pipBtn"></button></div>
  </header>
  <aside class="rail"><div class="cap" id="modes"></div><div class="cap" id="acts"></div></aside>
  <main id="board" class="bg-grid"><div id="widgets" class="wlayer"></div><canvas id="ink"></canvas><div class="pager" id="pager"></div></main>
  <aside class="side">
    <h3 id="sideTtl">Pen<i>畫筆</i></h3>
    <div class="prev" id="prev"><i></i></div>
    <div><div class="lab"><span>COLOR 筆色</span></div><div id="colors"></div></div>
    <div class="szbox"><div class="lab"><span>WEIGHT 粗細</span><b id="szVal">4</b></div><input type="range" id="szR" min="1" max="16" value="4" title="筆的粗細"></div>
    <button class="wide" id="toolsBtn">Σ 全部工具</button>
    <div class="polyart"></div>
  </aside>
 </div>
 <div class="menu" id="menu" hidden></div>
 <div id="toast"></div>
 <button id="orb" hidden title="點一下展開白板"><i></i></button>
</div>
<script>
(() => {
const app = document.getElementById('app');
const q = s => app.querySelector(s);
const board = q('#board'), ink = q('#ink'), menu = q('#menu'), toastEl = q('#toast');
let wl = q('#widgets');
const placeholder = document.getElementById('placeholder');
const ctx = ink.getContext('2d');
let win = window, pipWin = null;
const PLUM = '#473f4d';
let mode = 'pen', lastDraw = 'pen', color = PLUM, size = 4, elev = 4, paper = 'grid', night = false;
const strokes = [], redoStack = []; let cur = null, cleared = null, rafId = 0;
const SVGNS = 'http://www.w3.org/2000/svg';
function sv(tag, attrs = {}, parent) { const e = document.createElementNS(SVGNS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (parent) parent.appendChild(e); return e; }
function h(tag, cls, html) { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; }
function toast(msg, ms = 3200) { toastEl.textContent = msg; toastEl.classList.add('show'); clearTimeout(toast.t); toast.t = setTimeout(() => toastEl.classList.remove('show'), ms); }
const fmt = v => String(+(+v).toFixed(6));
const I = d => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">${d}</svg>`;
const ICON = {
  hand: I('<path d="M6 3l13 7.5-6 1.6-2.6 5.9z"/>'),
  pen: I('<path d="M4 20l1-4.5L16.5 4a2.1 2.1 0 013 3L8 18.5z"/><path d="M14 6.5l3 3"/>'),
  hl: I('<path d="M15 4l5 5-8 8H7v-5z"/><path d="M7 17l-3 3h6"/>'),
  line: I('<path d="M5.5 18.5l13-13"/><circle cx="5" cy="19" r="1.6"/><circle cx="19" cy="5" r="1.6"/>'),
  eraser: I('<path d="M4 15.5l9.5-9.5 5.5 5.5-7 7H8z"/><path d="M9 9.5l5.5 5.5M13 19h7"/>'),
  undo: I('<path d="M9 13L4.5 8.5 9 4"/><path d="M4.5 8.5H14a5.5 5.5 0 010 11h-3"/>'),
  redo: I('<path d="M15 13l4.5-4.5L15 4"/><path d="M19.5 8.5H10a5.5 5.5 0 000 11h3"/>'),
  trash: I('<path d="M4 7h16M9.5 7V4.5h5V7M6 7l1 13h10l1-13"/>'),
  sun: I('<circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/>'),
  moon: I('<path d="M19.5 14.5A8 8 0 019.5 4.5a8 8 0 1010 10z"/>'),
  pin: I('<path d="M12 16.5V21"/><path d="M8.5 3.5h7l-1 6 3 3.5h-11l3-3.5z"/>'),
  back: I('<rect x="4" y="5" width="16" height="13" rx="3"/><path d="M12 9v6M9 12l3 3 3-3"/>')
};
const MODES = { hand: ['操作', 'Select'], pen: ['畫筆', 'Pen'], hl: ['螢光筆', 'Marker'], line: ['直線', 'Line'], eraser: ['橡皮擦', 'Eraser'] };
const COLORS = [PLUM, '#e0466f', '#3b74d9', '#2f9e6e', '#e3a21a', '#ffffff'];

function undo() { if (strokes.length) redoStack.push(strokes.pop()); else if (cleared) { strokes.push(...cleared); cleared = null; } redraw(); }
function redo() { if (redoStack.length) { strokes.push(redoStack.pop()); redraw(); } }
function clearInk() { if (!strokes.length) return; cleared = strokes.splice(0); redraw(); toast('已清除筆跡（按「復原」可以救回來）'); }
function applyBg() { board.className = (paper === 'none' ? '' : 'bg-' + paper) + (night ? ' night' : ''); }

for (const m in MODES) { const b = h('button', 'rb', ICON[m] + `<span>${MODES[m][0]}</span>`); b.dataset.mode = m; b.title = MODES[m][0] + (m === 'hand' ? '' : '（長按後拖曳可調粗細）'); if (m === 'hand') b.onclick = () => setMode(m); else pressSize(b, m); q('#modes').appendChild(b); }
[['undo', '復原', undo, ''], ['redo', '重做', redo, ''], ['trash', '清除', clearInk, ' danger']].forEach(([ic, nm, fn, c]) => { const b = h('button', 'rb' + c, ICON[ic] + `<span>${nm}</span>`); b.title = nm; b.onclick = fn; q('#acts').appendChild(b); });
const swatches = COLORS.map(c => { const b = h('button', 'sw'); b.style.background = c; b.title = '顏色'; b.onclick = () => { pickColor(c); if (mode === 'hand' || mode === 'eraser') setMode(lastDraw); }; q('#colors').appendChild(b); return b; });
const szR = q('#szR'), prev = q('#prev');
const lv = () => mode === 'eraser' ? elev : size;
function setLv(v) { v = Math.max(1, Math.min(16, v)); if (mode === 'eraser') elev = v; else size = v; drawPrev(); }
function drawPrev() {
  const bar = prev.firstElementChild, hl = mode === 'hl', er = mode === 'eraser';
  const c = er ? '#d9cfd6' : hl && color === PLUM ? '#f9d65c' : color;
  bar.style.height = Math.min(30, er ? elev * 2 + 4 : hl ? size * 2 + 6 : size + 1) + 'px'; bar.style.background = c; bar.style.opacity = hl ? .5 : 1;
  prev.classList.toggle('dark', !er && (night || color === '#ffffff'));
  szR.value = lv(); szR.style.setProperty('--p', ((lv() - 1) / 15 * 100) + '%'); q('#szVal').textContent = lv();
}
szR.oninput = () => setLv(+szR.value);
/* long-press a pen / eraser button, then drag to resize */
const pop = h('div', 'szpop', '<span class="dotbox"><i></i></span><span><b></b><small>往右／上拖 變粗 · 往左／下 變細</small></span>'); pop.hidden = true; app.appendChild(pop);
function showPop(btn) {
  const er = mode === 'eraser', hl = mode === 'hl', d = er ? 14 + elev * 3 : hl ? 10 + size * 3 : 4 + size * 2.4, dot = pop.querySelector('i');
  dot.style.width = dot.style.height = d + 'px';
  dot.style.background = er ? 'transparent' : hl && color === PLUM ? '#f9d65c' : color; dot.style.border = er ? '2px dashed #d28672' : color === '#ffffff' ? '1px solid #d9c2cc' : '0'; dot.style.opacity = hl ? .6 : 1;
  pop.querySelector('b').textContent = `${MODES[mode][0]}粗細 ${lv()}`;
  pop.hidden = false;
  const fr = app.getBoundingClientRect(), r = btn.getBoundingClientRect();
  if (app.classList.contains('compact')) { pop.style.left = Math.max(6, Math.min(fr.width - pop.offsetWidth - 6, r.left - fr.left)) + 'px'; pop.style.top = (r.bottom - fr.top + 10) + 'px'; return; }
  pop.style.left = (r.right - fr.left + 12) + 'px'; pop.style.top = Math.max(8, Math.min(fr.height - pop.offsetHeight - 8, r.top - fr.top + r.height / 2 - pop.offsetHeight / 2)) + 'px';
}
function pressSize(b, m) {
  let timer = 0, active = false, suppress = false, sx = 0, sy = 0, start = 0;
  b.style.touchAction = 'none';
  b.addEventListener('pointerdown', e => {
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    sx = e.clientX; sy = e.clientY; active = false; try { b.setPointerCapture(e.pointerId); } catch (_) {}
    timer = setTimeout(() => { active = true; closeTray(); setMode(m); start = lv(); showPop(b); }, 380);
  });
  b.addEventListener('pointermove', e => {

/* ---------- 單位換算（定位板式：數字不動，換單位＝小數點移位） ---------- */
function convert() {

  const U = {

    重量: { hi: 4, lo: -3, units: [['公噸', 3], ['公斤', 0], ['公克', -3]] },
    容量: { hi: 4, lo: -3, units: [['公秉', 3], ['公升', 0], ['分公升', -1], ['毫升', -3]] },
    面積: { hi: 7, lo: -4, units: [['平方公里', 6], ['公頃', 4], ['公畝', 2], ['平方公尺', 0], ['平方公分', -4]] },
    體積: { hi: 2, lo: -6, units: [['立方公尺', 0], ['公升', -3], ['立方公分', -6], ['毫升', -6]] }

  let cat = '長度', from = 1, dg = {};
  const reset = () => { dg = {}; dg[0] = 1; from = U[cat].units.findIndex(u => u[1] === 0); };
  const clr = h('button', null, '清空'); clr.onclick = () => { dg = {}; draw(); };
  row.style.justifyContent = 'center';
  row.append(slideNum('類別', () => cat, v => { cat = v; reset(); draw(); }, { list: Object.keys(U), cycle: true, px: 30 }), clr);
  wrap.append(row, grid, read, list, tip('在格子上按住上下滑動填數字・點一下 ＋1<br>點單位名稱（或下面的結果），小數點就移到那個單位'));
  const reading = ue => { // exact string of the digits read in the unit whose exponent is ue
    const c = U[cat]; let ip = '', fp = '';
    for (let e = c.hi; e >= c.lo; e--) (e >= ue ? (ip += dg[e] || 0) : (fp += dg[e] || 0));
    ip = ip.replace(/^0+(?=\d)/, ''); fp = fp.replace(/0+$/, ''); return fp ? `${ip}.${fp}` : ip;
  };

    const c = U[cat], ue = c.units[from][1], exps = []; for (let e = c.hi; e >= c.lo; e--) exps.push(e);

    let head = '', i = 0, g = 0;
    while (i < exps.length) { const o = owner(exps[i]); let n = 1; while (i + n < exps.length && owner(exps[i + n]) === o) n++; const names = c.units.filter(u => u[1] === o[1]).map(u => u[0]).join('<br>'); head += `<div class="uh${o[1] === ue ? ' on' : ''}" data-e="${o[1]}" style="grid-column:span ${n};background:${TINT[g % TINT.length]}">${names}</div>`; exps.slice(i, i + n).forEach(e => (owner[e] = g)); i += n; g++; }
    const tintOf = {}; { let k = 0, gi = 0; while (k < exps.length) { const o = owner(exps[k]); let n = 1; while (k + n < exps.length && owner(exps[k + n]) === o) n++; exps.slice(k, k + n).forEach(e => (tintOf[e] = TINT[gi % TINT.length])); k += n; gi++; } }

    const cells = exps.map(e => { const show = e <= top && e >= bot, d = dg[e] || 0; return `<div class="uc${e === ue ? ' pt' : ''}${e === ue && bot < ue ? ' dot' : ''}" data-e="${e}" style="background:${tintOf[e]}55"><b class="${d ? '' : 'z'}">${show ? d : ''}</b></div>`; }).join('');
    grid.style.gridTemplateColumns = `repeat(${exps.length},36px)`; grid.innerHTML = head + sub + cells;
    read.innerHTML = `<b>${reading(ue)}</b> ${c.units[from][0]}`;
    list.innerHTML = c.units.map((u, k) => `<span class="ur${k === from ? ' on' : ''}" data-i="${k}"><b>${reading(u[1])}</b> ${u[0]}</span>`).join('');
  }

    grid.addEventListener('pointermove', mv); grid.addEventListener('pointerup', up); grid.addEventListener('pointercancel', up);
  });
  list.addEventListener('click', e => { const r = e.target.closest('.ur'); if (r) { from = +r.dataset.i; draw(); } });
  reset(); draw(); addWidget(PI('convert', 24) + '單位換算', wrap);
}
